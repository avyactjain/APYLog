<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>APYLog</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #111;
        color: #eee;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }

      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 3rem;
      }

      h1 {
        margin: 0 0 1.5rem;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      #countdown {
        margin: 0;
        font-size: 48px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }

      .caption {
        margin: 0.4rem 0 1.75rem;
        color: #999;
        font-size: 0.95rem;
      }

      #status {
        margin: 0 0 1rem;
        color: #f0ad4e;
        font-size: 0.9rem;
        min-height: 1.2em;
      }

      #status:empty {
        display: none;
      }

      #snapshot-count {
        margin: 0 0 1.25rem;
        font-size: 1.05rem;
      }

      #positions {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      article {
        padding: 1rem 1.1rem;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        background: #181818;
      }

      article h2 {
        margin: 0 0 0.75rem;
        font-size: 1.05rem;
        font-weight: 600;
      }

      dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.35rem 1rem;
        font-size: 0.95rem;
      }

      dt {
        color: #999;
      }

      dd {
        margin: 0;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .ok {
        color: #3dd68c;
      }

      .low {
        color: #f0ad4e;
      }

      #total-charge {
        margin: 1.5rem 0 0;
        font-size: 1.1rem;
        font-weight: 600;
      }

      .waiting {
        color: #999;
      }

      .section-label {
        margin: 0.85rem 0 0.35rem;
        color: #bbb;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .section-label:first-of-type {
        margin-top: 0;
      }

      #chart-panel {
        margin: 0 0 1.75rem;
      }

      #chart-panel.hidden {
        display: none;
      }

      #chart-caption {
        margin: 0 0 0.6rem;
        color: #999;
        font-size: 0.9rem;
      }

      #range-buttons {
        display: flex;
        gap: 0.4rem;
        margin: 0 0 0.85rem;
      }

      #range-buttons button {
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        background: #181818;
        color: #eee;
        padding: 0.35rem 0.7rem;
        font: inherit;
        cursor: pointer;
      }

      #range-buttons button.active {
        background: #2a2a2a;
        border-color: #666;
      }

      #apy-chart-wrap {
        position: relative;
        height: 280px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>APYLog</h1>
      <p id="countdown">--:--</p>
      <p class="caption">until next snapshot</p>
      <p id="status"></p>
      <p id="snapshot-count"></p>
      <div id="chart-panel" class="hidden">
        <p id="chart-caption"></p>
        <div id="range-buttons">
          <button type="button" data-range="1d">1d</button>
          <button type="button" data-range="1w" class="active">1w</button>
          <button type="button" data-range="1m">1m</button>
          <button type="button" data-range="1y">1y</button>
        </div>
        <div id="apy-chart-wrap">
          <canvas id="apy-chart"></canvas>
        </div>
      </div>
      <div id="positions"></div>
      <p id="total-charge"></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script>
      const GUARANTEE = 0.02;
      const countdownEl = document.getElementById("countdown");
      const statusEl = document.getElementById("status");
      const snapshotCountEl = document.getElementById("snapshot-count");
      const positionsEl = document.getElementById("positions");
      const totalChargeEl = document.getElementById("total-charge");
      const chartPanelEl = document.getElementById("chart-panel");
      const chartCaptionEl = document.getElementById("chart-caption");
      const rangeButtonsEl = document.getElementById("range-buttons");
      const chartCanvas = document.getElementById("apy-chart");

      let nextSnapshotAt = null;
      let chartRange = "1w";
      let chartVaultId = null;
      let chartNftId = null;
      let apyChart = null;
      let historyLoaded = false;

      function pad2(n) {
        return String(n).padStart(2, "0");
      }

      function formatRemaining(ms) {
        const total = Math.max(0, Math.floor(ms / 1000));
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const seconds = total % 60;
        if (hours >= 1) {
          return hours + ":" + pad2(minutes) + ":" + pad2(seconds);
        }
        return minutes + ":" + pad2(seconds);
      }

      function formatPct(value) {
        return (value * 100).toFixed(2) + "%";
      }

      function formatUsd(value) {
        return value.toFixed(2);
      }

      function formatCharge(value) {
        return value.toFixed(6);
      }

      function text(value) {
        return document.createTextNode(String(value));
      }

      function row(dtText, ddNode) {
        const dt = document.createElement("dt");
        dt.appendChild(text(dtText));
        const dd = document.createElement("dd");
        dd.appendChild(ddNode);
        return [dt, dd];
      }

      function appendRows(dl, fields) {
        for (const [dt, dd] of fields) {
          dl.appendChild(dt);
          dl.appendChild(dd);
        }
      }

      function sectionLabel(label) {
        const p = document.createElement("p");
        p.className = "section-label";
        p.appendChild(text(label));
        return p;
      }

      function netApyNode(value) {
        const span = document.createElement("span");
        span.className = value >= GUARANTEE ? "ok" : "low";
        span.appendChild(text(formatPct(value)));
        return span;
      }

      function hideChart() {
        chartPanelEl.classList.add("hidden");
        chartVaultId = null;
        chartNftId = null;
        historyLoaded = false;
      }

      function pctSeries(points, key) {
        return points.map((p) => (p[key] || 0) * 100);
      }

      function renderChart(points) {
        const labels = points.map((p) => p.timestamp);
        const data = {
          labels,
          datasets: [
            {
              label: "supply",
              data: pctSeries(points, "supplyApy"),
              borderColor: "#3dd68c",
              backgroundColor: "transparent",
              tension: 0.2,
              pointRadius: 0,
            },
            {
              label: "borrow",
              data: pctSeries(points, "borrowApy"),
              borderColor: "#f0ad4e",
              backgroundColor: "transparent",
              tension: 0.2,
              pointRadius: 0,
            },
          ],
        };
        const options = {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { labels: { color: "#ccc" } },
            tooltip: {
              callbacks: {
                afterBody(items) {
                  if (items.length === 0) {
                    return "";
                  }
                  const chart = items[0].chart;
                  const i = items[0].dataIndex;
                  const supply = Number(chart.data.datasets[0]?.data[i] ?? 0);
                  const borrow = Number(chart.data.datasets[1]?.data[i] ?? 0);
                  return "spread: " + (supply - borrow).toFixed(2) + "%";
                },
              },
            },
          },
          scales: {
            x: {
              ticks: {
                color: "#888",
                maxTicksLimit: 8,
                callback: function (value) {
                  const label = this.getLabelForValue(value);
                  const d = new Date(label);
                  if (Number.isNaN(d.getTime())) {
                    return label;
                  }
                  return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
                },
              },
              grid: { color: "#222" },
            },
            y: {
              ticks: {
                color: "#888",
                callback: (value) => Number(value).toFixed(2) + "%",
              },
              grid: { color: "#222" },
            },
          },
        };
        if (apyChart !== null) {
          apyChart.destroy();
        }
        apyChart = new Chart(chartCanvas, { type: "line", data, options });
      }

      async function fetchHistory() {
        if (chartVaultId === null || chartNftId === null) {
          return;
        }
        try {
          const url =
            "/api/history?vaultId=" +
            encodeURIComponent(String(chartVaultId)) +
            "&nftId=" +
            encodeURIComponent(String(chartNftId)) +
            "&range=" +
            encodeURIComponent(chartRange);
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) {
            throw new Error("bad status");
          }
          const data = await res.json();
          renderChart(data.points || []);
        } catch {
          return;
        }
      }

      function renderSummary(data) {
        if (data.snapshots === 0) {
          snapshotCountEl.textContent = "";
          positionsEl.replaceChildren();
          const waiting = document.createElement("p");
          waiting.className = "waiting";
          waiting.appendChild(text("Waiting for first snapshot"));
          positionsEl.appendChild(waiting);
          totalChargeEl.textContent = "";
          hideChart();
          return;
        }

        snapshotCountEl.textContent = data.snapshots + " snapshots";
        positionsEl.replaceChildren();

        for (const pos of data.positions) {
          const last = pos.lastSnapshot || {};
          const article = document.createElement("article");
          const heading = document.createElement("h2");
          heading.appendChild(text("vault " + pos.vaultId + ", NFT " + pos.nftId));
          article.appendChild(heading);

          article.appendChild(sectionLabel("Last snapshot"));
          const detailDl = document.createElement("dl");
          appendRows(detailDl, [
            row("PST deposited", text("$" + formatUsd(last.token0Usd || 0))),
            row("PST APY", text(formatPct(last.token0Apy || 0))),
            row("USDC deposited", text("$" + formatUsd(last.token1Usd || 0))),
            row("USDC APY", text(formatPct(last.token1Apy || 0))),
            row("trading APY", text(formatPct(last.tradingApy || 0))),
            row("supply APY", text(formatPct(last.supplyApy || 0))),
            row("JupUSD borrowed", text("$" + formatUsd(last.borrowed || 0))),
            row("borrow APY", text(formatPct(last.borrowApy || 0))),
            row("equity", text("$" + formatUsd(last.equity || 0))),
            row("net APY", netApyNode(last.netApy || 0)),
          ]);
          article.appendChild(detailDl);

          article.appendChild(sectionLabel("Guarantee"));
          const guaranteeDl = document.createElement("dl");
          appendRows(guaranteeDl, [
            row("snapshots", text(pos.snapshots)),
            row("first", text(pos.firstAt)),
            row("last", text(pos.lastAt)),
            row("under 2%", text(pos.below2pct)),
            row("charge", text(formatCharge(pos.chargeToDate))),
          ]);
          article.appendChild(guaranteeDl);

          positionsEl.appendChild(article);
        }

        totalChargeEl.textContent = "Total charge: " + formatCharge(data.totalCharge);

        const first = data.positions[0];
        if (first) {
          const firstLoad = !historyLoaded;
          chartVaultId = first.vaultId;
          chartNftId = first.nftId;
          chartCaptionEl.textContent = "Supply and borrow, vault " + first.vaultId + ", NFT " + first.nftId;
          chartPanelEl.classList.remove("hidden");
          if (firstLoad) {
            historyLoaded = true;
            void fetchHistory();
          }
        } else {
          hideChart();
        }
      }

      function tickCountdown() {
        if (nextSnapshotAt === null) {
          countdownEl.textContent = "--:--";
          return;
        }
        const remaining = Date.parse(nextSnapshotAt) - Date.now();
        countdownEl.textContent = formatRemaining(remaining);
      }

      async function fetchSummary() {
        try {
          const res = await fetch("/api/summary", { cache: "no-store" });
          if (!res.ok) {
            throw new Error("bad status");
          }
          const data = await res.json();
          nextSnapshotAt = data.nextSnapshotAt;
          statusEl.textContent = "";
          renderSummary(data);
          tickCountdown();
        } catch {
          statusEl.textContent = "Could not load summary";
        }
      }

      rangeButtonsEl.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-range]");
        if (!button) {
          return;
        }
        chartRange = button.getAttribute("data-range") || "1w";
        for (const child of rangeButtonsEl.querySelectorAll("button")) {
          child.classList.toggle("active", child === button);
        }
        void fetchHistory();
      });

      fetchSummary();
      setInterval(fetchSummary, 1000);
      setInterval(() => {
        void fetchHistory();
      }, 30000);
      setInterval(tickCountdown, 250);
    </script>
  </body>
</html>
