services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: apylog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: apylog
    volumes:
      - apylog_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apylog -d apylog"]
      interval: 5s
      timeout: 5s
      retries: 10

  apylog:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RPC_URL: ${RPC_URL}
      DB_URL: postgresql://apylog:${POSTGRES_PASSWORD}@postgres:5432/apylog
      APP_ENV: prod
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  apylog_pgdata:
